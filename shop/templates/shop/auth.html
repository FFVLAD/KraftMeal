<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ type }} | MalvorX</title>
    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 300px;
            text-align: center;
        }
        h2 {
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 15px;
            margin-bottom: 40px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 0;
            margin-bottom: 25px;
            border: none;
            border-bottom: 1px solid #000000;
            outline: none;
            font-size: 13px;
        }
        button {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
        }
        form p {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            color: #222;
            letter-spacing: 1px;
        }
        .link {
            display: block;
            margin-top: 25px;
            font-size: 11px;
            color: #555;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>
        {% if type == "Вход" %} Iniciar Sesión {% else %} Registrarse {% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">OK</button>
    </form>

    {% if type == "Вход" %}
        <a class="link" href="{% url 'register' %}">Crear una cuenta</a>
    {% else %}
        <a class="link" href="{% url 'login' %}">¿Ya tiene una cuenta? Iniciar sesión</a>
    {% endif %}
    <a class="link" href="{% url 'index' %}" style="color: #ccc; margin-top: 40px;">← Volver al inicio</a>
</div>
</body>
</html>
