{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} — KraftMeal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #4a532d;
            --card-bg: rgba(20, 35, 27, 0.92);
            --accent-gold: #e2b049;
            --text-light: #f3f5f4;
            --text-muted: #cbd7c8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(85vw, 500px);
            height: min(85vw, 500px);
            background-image: url('{% static "shop/images/logo_bg.png" %}');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 75%);
        }

        header {
            background: rgba(18, 32, 24, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(226, 176, 73, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 10px;
            background: rgba(226, 176, 73, 0.1);
        }

        .logo a {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            text-decoration: none;
        }
        .logo span { color: var(--accent-gold); font-family: 'Caveat', cursive; font-size: 26px; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
            width: 100%;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .detail-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(226, 176, 73, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .product-hero-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            background: rgba(0,0,0,0.2);
        }

        .content { padding: 22px; }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .portion-tag {
            display: inline-block;
            background: rgba(226, 176, 73, 0.15);
            color: var(--accent-gold);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
            border: 1px solid rgba(226, 176, 73, 0.3);
        }

        .description {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .price-tag {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .btn-buy {
            background: linear-gradient(135deg, var(--accent-gold), #c99833);
            color: #121f18;
            padding: 14px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            touch-action: manipulation;
        }

        @media(max-width: 480px) {
            .product-hero-img { height: 210px; }
            .title { font-size: 20px; }
            .price-tag { font-size: 24px; }
            .btn-buy { padding: 12px 18px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="bg-watermark"></div>

    <header>
        <a href="{% url 'index' %}" class="back-btn">←</a>
        <div class="logo"><a href="{% url 'index' %}">Kraft<span>Meal</span></a></div>
    </header>

    <div class="container">
        <div class="detail-card">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.title }}" class="product-hero-img">
            {% endif %}
            <div class="content">
                <h1 class="title">{{ product.title }}</h1>
                {% if product.weight_or_portion %}
                    <div class="portion-tag">⚖️ {{ product.weight_or_portion }}</div>
                {% endif %}
                <p class="description">{{ product.description }}</p>

                <div class="action-bar">
                    <div class="price-tag">{{ product.price }}€</div>
                    <a href="{% url 'checkout' %}?direct_product={{ product.id }}" class="btn-buy">Замовити зараз</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
